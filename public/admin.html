<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة تحكم أكاديمية القدرات</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Aref+Ruqaa:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
<style>
body{padding-bottom:0}
.adm{max-width:1200px;margin:0 auto;padding:24px 16px 60px;display:grid;gap:20px}
.adm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adm-top h1{flex:1}
.login{max-width:420px;margin:40px auto;display:grid;gap:12px}
.login label{display:grid;gap:4px;font-size:.86rem;font-weight:700;color:var(--ink2)}
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:1000px){.kgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kgrid{grid-template-columns:1fr 1fr}}
.dist{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:90px 1fr 50px;gap:10px;align-items:center;font-size:.88rem}
.dbar{block-size:14px;background:var(--surface2);border-radius:99px;position:relative}
.dbar span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--pri)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:200px}
.ut{inline-size:100%;border-collapse:collapse;font-size:.88rem}
.ut th{cursor:pointer;white-space:nowrap;user-select:none}
.ut th.sorted::after{content:" ▾"} .ut th.sorted.asc::after{content:" ▴"}
.ut td.mail{direction:ltr;text-align:start;unicode-bidi:plaintext;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ut td{white-space:nowrap}
.ut td,.ut th{padding:9px 8px}
.uid{font-family:var(--f-mono);font-size:.85rem;direction:ltr;unicode-bidi:plaintext;background:var(--surface2);padding:8px 10px;border-radius:10px;word-break:break-all}
.steps-a{padding-inline-start:1.2em;display:grid;gap:6px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.status{font-size:.86rem;color:var(--muted)}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ut th:focus-visible{outline-offset:-3px}
.tbl{position:relative}
.ut td .row{flex-wrap:nowrap;gap:6px}
@media (max-width:520px){.adm-top h1{flex-basis:100%;font-size:1.3rem}.drow{grid-template-columns:70px 1fr 36px}}
</style>
</head>
<body>
<div class="adm" id="root"><p class="status">جارٍ التحميل...</p></div>
<div id="toast" role="status" hidden></div>
<script src="admin.js" defer></script>
</body>
</html>
